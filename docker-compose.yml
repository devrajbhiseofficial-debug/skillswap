services:
  web:
    build: .
    ports: ["${WEB_PORT:-80}:8000"]
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DATABASE_URL: postgresql+psycopg2://skillswap:${DB_PASSWORD:-skillpass}@db:5432/skillswap
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TURN_URL: ${TURN_URL:-}
      TURN_USER: ${TURN_USER:-}
      TURN_PASS: ${TURN_PASS:-}
    depends_on: [db]
    restart: always
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillswap
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skillpass}
      POSTGRES_DB: skillswap
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: always
  caddy:
    image: caddy:2
    profiles: ["https"]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile", "caddydata:/data"]
    depends_on: [web]
    restart: always
volumes:
  pgdata:
  caddydata:
